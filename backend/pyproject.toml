[project]
name = "backend"
version = "0.1.0"
description = "烟草智能客服系统后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "fastapi>=0.138.0",
    "fpdf2>=2.8.7",
    "httpx[socks]>=0.28.1",
    "markitdown[pdf]>=0.1.6",
    "openai>=2.44.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.49.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
