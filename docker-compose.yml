services:
  ollama:
    image: ollama/ollama:latest
    container_name: tobacco-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tobacco-backend
    volumes:
      - app-data:/app/data
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tobacco-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ollama-models:
  app-data:
